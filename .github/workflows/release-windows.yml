name: Release Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (major.minor.patch)
        type: string
        required: true
      minimum_version:
        description: Minimum supported client version
        type: string
        default: '0.0.0'
      channel:
        description: Release channel
        type: choice
        options: [test, stable]
        required: true
permissions:
  contents: read
concurrency:
  group: spectravision-release-${{ inputs.channel }}
jobs:
  verify:
    if: (inputs.channel == 'stable' && github.ref == 'refs/heads/main') || (inputs.channel == 'test' && github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    runs-on: windows-latest
    environment: ${{ inputs.channel == 'stable' && 'production' || 'staging' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and sign
        shell: pwsh
        env:
          SV_VERSION: ${{ inputs.version }}
          SV_MINIMUM: ${{ inputs.minimum_version }}
          SV_CHANNEL: ${{ inputs.channel }}
          SV_RELEASE_SIGNING_KEY: ${{ secrets.SV_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:SV_RELEASE_SIGNING_KEY) { throw 'Missing protected release signing secret.' }
          ./installer/build-release.ps1 -Version $env:SV_VERSION -MinimumVersion $env:SV_MINIMUM -Test:($env:SV_CHANNEL -eq 'test')
      - name: Create draft release for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SV_VERSION: ${{ inputs.version }}
          SV_CHANNEL: ${{ inputs.channel }}
        run: |
          $tag = "sv-$env:SV_CHANNEL-v$env:SV_VERSION"
          $stage = "release/cloud-control/$env:SV_CHANNEL/$env:SV_VERSION"
          $options = @()
          if ($env:SV_CHANNEL -eq 'test') { $options += '--prerelease' }
          gh release create $tag "$stage/SpectraVision-Setup-$env:SV_VERSION.exe" "$stage/latest.json" "$stage/SHA256SUMS.txt" "$stage/release-metadata.json" --target $env:GITHUB_SHA --title "SpectraVision $env:SV_VERSION ($env:SV_CHANNEL)" --draft --generate-notes @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
